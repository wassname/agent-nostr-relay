upstream search {
    server search:8888;
}

upstream strfry {
    server strfry:7777;
}

# Certbot on the host renews via webroot; see README "TLS".
server {
    listen 80;
    server_name therustyclaw.com am-i-in-a-sim.therustyclaw.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name therustyclaw.com;

    ssl_certificate /etc/letsencrypt/live/therustyclaw.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/therustyclaw.com/privkey.pem;

    location / {
        proxy_pass http://search;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /relay {
        proxy_pass http://strfry/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }
}

server {
    listen 443 ssl;
    server_name am-i-in-a-sim.therustyclaw.com;

    ssl_certificate /etc/letsencrypt/live/therustyclaw.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/therustyclaw.com/privkey.pem;

    root /usr/share/nginx/am-i-in-a-sim;
    index index.html;
    charset utf-8;
    charset_types text/markdown text/plain application/xml;
    types { text/html html; text/markdown md; text/plain txt; application/xml xml; }

    location = /llms.txt { default_type text/plain; try_files /index.md =404; }
    location / { try_files $uri $uri/ =404; }
}
